<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hecnic Dashboard - Cyberpunk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0a2e 50%, #16213e 100%);
            color: #00ff88;
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 136, 0.03) 0px,
                    rgba(0, 255, 136, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: 1;
            animation: scanlines 8s linear infinite;
        }

        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        header {
            background: rgba(10, 14, 39, 0.8);
            border-bottom: 2px solid #ff006e;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            letter-spacing: 2px;
        }

        .theme-toggle {
            background: transparent;
            border: 2px solid #00ff88;
            padding: 0.5rem 1.5rem;
            border-radius: 0;
            cursor: pointer;
            font-size: 0.875rem;
            color: #00ff88;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .theme-toggle:hover {
            background: #00ff88;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
            position: relative;
            z-index: 2;
        }

        .header-section {
            margin-bottom: 3rem;
            border-left: 4px solid #ff006e;
            padding-left: 1.5rem;
        }

        .header-section h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            letter-spacing: 2px;
        }

        .header-section p {
            color: #ff006e;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .project-card {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.05) 0%, rgba(255, 0, 110, 0.05) 100%);
            border: 2px solid #00ff88;
            border-radius: 2px;
            padding: 1.75rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3), transparent);
            transition: left 0.5s;
        }

        .project-card:hover {
            border-color: #ff006e;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.6), inset 0 0 20px rgba(0, 255, 136, 0.1);
            transform: translateY(-4px);
        }

        .project-card:hover::before {
            left: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff006e;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: #333;
            transition: all 0.3s;
        }

        .status-dot.active {
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .status-dot.error {
            background: #ff006e;
            box-shadow: 0 0 10px rgba(255, 0, 110, 0.8);
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.8); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 136, 1); }
        }

        .card-tag {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: transparent;
            color: #00ff88;
            border: 1px solid #00ff88;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .card-description {
            color: #a0a0a0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 2;
        }

        .card-footer {
            display: flex;
            gap: 1rem;
            position: relative;
            z-index: 2;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #ff006e;
            color: #0a0e27;
            border: 2px solid #ff006e;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.875rem;
            text-decoration: none;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-link:hover {
            background: transparent;
            color: #ff006e;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.6);
        }

        .footer {
            text-align: center;
            color: #666;
            font-size: 0.875rem;
            padding-top: 2rem;
            border-top: 2px solid #00ff88;
            margin-top: 3rem;
            position: relative;
            z-index: 2;
        }

        .last-update {
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">▌ HECNIC ▌</div>
        <button class="theme-toggle" onclick="toggleTheme()">
            <span id="theme-icon">🌙</span>
        </button>
    </header>

    <div class="container">
        <div class="header-section">
            <h1>>>> DASHBOARD <<<</h1>
            <p>// ACCESO CENTRALIZADO A TODOS TUS PROYECTOS</p>
        </div>

        <div class="projects-grid" id="projects-grid">
            <!-- Projects will be rendered here -->
        </div>

        <div class="footer">
            <p>Última actualización: <span class="last-update" id="last-update">Cargando...</span></p>
        </div>
    </div>

    <script>
        const projects = [
            {
                name: 'HecnicWeb',
                description: 'Landing page pública de Construcciones Hecnic',
                url: 'https://construccioneshecnic.es',
                container: 'hecnic-landing',
                tag: 'Producción',
            },
            {
                name: 'HecnicApp',
                description: 'App de gestión interna para Construcciones Hecnic',
                url: 'https://construccioneshecnic.es/app',
                container: 'hecnic-web',
                tag: 'Producción',
            },
            {
                name: 'CuentasPersonales',
                description: 'Gestión de finanzas personales',
                url: null,
                container: null,
                tag: 'En desarrollo',
            },
        ];

        let containerStatus = {};

        async function updateStatus() {
            try {
                const response = await fetch('/dashboard/api/status.json');
                if (response.ok) {
                    containerStatus = await response.json();
                }
            } catch (e) {
                console.error('Error fetching status:', e);
            }

            updateProjectCards();
            updateTimestamp();
        }

        function updateProjectCards() {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = projects.map(project => {
                const status = containerStatus[project.container] || null;
                const isActive = status === 'running';

                return `
                    <div class="project-card">
                        <div class="card-header">
                            <div class="card-title">${project.name}</div>
                            ${project.container ? `
                                <div class="card-status">
                                    <div class="status-dot ${isActive ? 'active' : status === 'exited' ? '' : 'error'}"></div>
                                    <span>${isActive ? 'ACTIVO' : 'DETENIDO'}</span>
                                </div>
                            ` : ''}
                        </div>
                        <div class="card-tag">[ ${project.tag} ]</div>
                        <p class="card-description">${project.description}</p>
                        <div class="card-footer">
                            ${project.url ? `<a href="${project.url}" target="_blank" class="card-link">→ ABRIR</a>` : '<div></div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateTimestamp() {
            const now = new Date().toLocaleTimeString('es-ES');
            document.getElementById('last-update').textContent = now;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved === 'dark' || (saved === null && prefersDark);

            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').textContent = '☀️';
            } else {
                document.getElementById('theme-icon').textContent = '🌙';
            }
        }

        initTheme();
        updateStatus();
        setInterval(updateStatus, 30000);
    </script>
</body>
</html>
