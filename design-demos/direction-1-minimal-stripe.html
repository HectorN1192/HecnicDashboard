<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hecnic Dashboard - Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e5e5;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .theme-toggle {
            background: #f5f5f5;
            border: 1px solid #e5e5e5;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            color: #666;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: #efefef;
            border-color: #d5d5d5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .header-section {
            margin-bottom: 3rem;
        }

        .header-section h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header-section p {
            color: #666;
            font-size: 1rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .project-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.2s;
        }

        .project-card:hover {
            border-color: #999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .card-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d5d5d5;
        }

        .status-dot.active {
            background: #34d399;
        }

        .status-dot.error {
            background: #f87171;
        }

        .card-tag {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            background: #f5f5f5;
            color: #666;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-description {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .card-footer {
            display: flex;
            gap: 1rem;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .card-link:hover {
            background: #333;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 0.875rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e5e5;
            margin-top: 3rem;
        }

        .last-update {
            font-weight: 500;
            color: #1a1a1a;
        }

        html.dark {
            background: #111;
            color: #e5e5e5;
        }

        html.dark header {
            background: #1a1a1a;
            border-bottom-color: #333;
        }

        html.dark .theme-toggle {
            background: #222;
            border-color: #333;
            color: #999;
        }

        html.dark .project-card {
            background: #1a1a1a;
            border-color: #333;
        }

        html.dark .project-card:hover {
            border-color: #555;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        html.dark .footer {
            border-top-color: #333;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Hecnic</div>
        <button class="theme-toggle" onclick="toggleTheme()">
            <span id="theme-icon">🌙</span>
        </button>
    </header>

    <div class="container">
        <div class="header-section">
            <h1>Dashboard</h1>
            <p>Acceso centralizado a todos tus proyectos</p>
        </div>

        <div class="projects-grid" id="projects-grid">
            <!-- Projects will be rendered here -->
        </div>

        <div class="footer">
            <p>Última actualización: <span class="last-update" id="last-update">Cargando...</span></p>
        </div>
    </div>

    <script>
        const projects = [
            {
                name: 'HecnicWeb',
                description: 'Landing page pública de Construcciones Hecnic',
                url: 'https://construccioneshecnic.es',
                container: 'hecnic-landing',
                tag: 'Producción',
            },
            {
                name: 'HecnicApp',
                description: 'App de gestión interna para Construcciones Hecnic',
                url: 'https://construccioneshecnic.es/app',
                container: 'hecnic-web',
                tag: 'Producción',
            },
            {
                name: 'CuentasPersonales',
                description: 'Gestión de finanzas personales',
                url: null,
                container: null,
                tag: 'En desarrollo',
            },
        ];

        let containerStatus = {};

        async function updateStatus() {
            try {
                const response = await fetch('/dashboard/api/status.json');
                if (response.ok) {
                    containerStatus = await response.json();
                }
            } catch (e) {
                console.error('Error fetching status:', e);
            }

            updateProjectCards();
            updateTimestamp();
        }

        function updateProjectCards() {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = projects.map(project => {
                const status = containerStatus[project.container] || null;
                const isActive = status === 'running';

                return `
                    <div class="project-card">
                        <div class="card-header">
                            <div class="card-title">${project.name}</div>
                            ${project.container ? `
                                <div class="card-status">
                                    <div class="status-dot ${isActive ? 'active' : status === 'exited' ? '' : 'error'}"></div>
                                    <span>${isActive ? 'Activo' : 'Detenido'}</span>
                                </div>
                            ` : ''}
                        </div>
                        <div class="card-tag">${project.tag}</div>
                        <p class="card-description">${project.description}</p>
                        <div class="card-footer">
                            ${project.url ? `<a href="${project.url}" target="_blank" class="card-link">Abrir →</a>` : '<div></div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateTimestamp() {
            const now = new Date().toLocaleTimeString('es-ES');
            document.getElementById('last-update').textContent = now;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
        }

        function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved === 'dark' || (saved === null && prefersDark);

            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').textContent = '☀️';
            } else {
                document.getElementById('theme-icon').textContent = '🌙';
            }
        }

        initTheme();
        updateStatus();
        setInterval(updateStatus, 30000);
    </script>
</body>
</html>
